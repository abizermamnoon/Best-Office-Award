<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7eee5"><meta name="description" content="A little celebration for the people who make our department special."><title>A Little Celebration | Best Office Award</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');
:root{color-scheme:light;--ink:#283d35;--paper:#fbf5eb;--pink:#f2c4bd;--green:#304d40}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100svh}header{padding:28px 6%;display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #304d401c}.brand{font-weight:700;letter-spacing:1px;font-size:14px}.brand span{color:#bd6a4e;margin-right:8px}main{min-height:calc(100svh - 140px);display:grid;place-items:center;padding:55px 24px 70px;position:relative;overflow:hidden}.card{max-width:630px;width:100%;text-align:center;position:relative;z-index:1}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-size:11px;font-weight:700;color:#8c654c;margin:24px 0}h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(39px,6vw,65px);line-height:1.13;letter-spacing:-1.8px;margin:18px 0 22px}h1 em{color:#af604d}p{font-size:16px;line-height:1.8;color:#677168;margin:0 auto 26px;max-width:480px}.cake{font-size:66px;display:inline-block;transform:rotate(-7deg);filter:drop-shadow(4px 9px 0 #e8d9c8)}form{padding:30px;background:#fffaf4;border:1px solid #e4d9c9;box-shadow:0 12px 30px #5d442808;border-radius:10px;margin:30px auto 0;max-width:490px;text-align:left}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-size:12px;font-weight:600;display:block;margin-bottom:9px}input{width:100%;font:inherit;font-size:15px;padding:14px 12px;border:1px solid #d8d6ca;border-radius:5px;background:#fffdf9;color:var(--ink)}input:focus{outline:2px solid #947958;outline-offset:3px}button,.back{cursor:pointer;border:0;font:inherit;border-radius:5px;background:var(--green);color:#fffaf0;padding:16px 24px;font-size:14px;font-weight:600}form button{width:100%;margin-top:21px;display:flex;justify-content:space-between}button:hover{background:#406451}button:focus-visible,.back:focus-visible{outline:3px solid #b87f57;outline-offset:4px}.small{font-size:11px;letter-spacing:.5px;margin:20px 0 0;color:#8b887c}.seal{display:inline-flex;align-items:center;justify-content:center;width:125px;height:125px;background:#efce77;border-radius:50%;font-size:72px;box-shadow:0 0 0 9px #f6e3ac,0 0 0 10px #d9bd78;margin:15px 0 25px}.decoration{position:absolute;pointer-events:none}.balloon{width:100px;height:130px;border-radius:50%;background:#dcb2a7;top:18%;left:7%;transform:rotate(-14deg)}.balloon:after{content:'';position:absolute;top:130px;left:50%;width:1px;height:200px;background:#b4a68e;transform:rotate(12deg);transform-origin:top}.balloon.right{left:auto;right:8%;top:35%;background:#b9c8ad;width:75px;height:100px;transform:rotate(14deg)}.balloon.right:after{top:100px}.star{color:#bd8c43;font-size:34px;top:13%;right:22%}.star.second{top:auto;bottom:15%;left:21%;font-size:25px}.confetti{inset:0;width:100%;height:100%;opacity:.7}.confetti i{position:absolute;width:6px;height:13px;background:var(--pink);transform:rotate(30deg)}footer{padding:20px 24px;text-align:center;color:#8b887c;font-size:10px;letter-spacing:2px;text-transform:uppercase}.terminal{font-family:monospace;letter-spacing:0;font-size:clamp(22px,4vw,36px);line-height:1.6;color:#254336}.progress{height:5px;background:#dcded3;border-radius:10px;overflow:hidden;margin:25px auto;width:240px}.progress:after{content:'';display:block;background:#304d40;height:100%;animation:load 1s linear forwards}@keyframes load{from{width:0}to{width:100%}}body.dark{background:#000;color:#fff}body.dark header,body.dark footer,body.dark .decoration{display:none}body.dark main{min-height:100svh}body.dark .card{max-width:1000px}body.dark h1{font-family:'DM Sans',sans-serif;color:#fff;letter-spacing:-1px;font-size:clamp(27px,5vw,55px)}.skull{display:block;width:min(65vw,420px);height:auto;margin:0 auto 25px;color:#fff}body.dark .back{background:#222;color:#bbb;margin-top:25px}@media(max-width:760px){header{padding:22px}.department{display:none}.balloon{left:-55px;opacity:.5}.balloon.right{right:-35px}.star{right:9%}.star.second{left:6%;bottom:6%}main{padding-top:35px}form{padding:24px}.fields{grid-template-columns:1fr}h1{letter-spacing:-1px}footer{line-height:1.7}}@media(prefers-reduced-motion:reduce){.progress:after{animation:none;width:100%}}
</style></head>
<body><header><div class="brand"><span>✳</span> A little celebration</div><div class="department">Notre Dame · Economics</div></header><main><div class="decoration balloon"></div><div class="decoration balloon right"></div><div class="decoration star">✦</div><div class="decoration star second">✦</div><div class="decoration confetti" aria-hidden="true"></div><section class="card" id="content" aria-live="polite"></section></main><footer>A small gesture. A great department. A reason to celebrate.</footer>
